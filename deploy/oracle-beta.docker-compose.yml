# Deckcelerate beta — beta.deckcelerate.com, on the same Oracle Cloud
# Ubuntu/Docker host as the toolbar.deckcelerate.com production stack
# (see deploy/oracle-toolbar.docker-compose.yml — read that file's header
# first, this one only calls out what differs).
#
# USAGE: copy this file to the root of its OWN separate git checkout —
# e.g. `git clone <repo> ~/apps/deckcelerate-beta` — copy
# oracle-beta.env.example to <checkout>/.env and fill it in, then run
# <checkout>/deploy.sh. A separate checkout (not a subfolder of the
# toolbar checkout) is what lets beta run ahead of — or behind — whatever
# commit toolbar is currently on, which is the whole point of having a
# beta environment: test a change here first, `git pull` it into the
# toolbar checkout separately once it's confirmed good.
#
# Differs from the toolbar stack only in: whatever values you put in this
# checkout's own .env (DOMAIN=beta.deckcelerate.com; MANIFEST_ID a distinct
# GUID from the toolbar instance's — see the toolbar compose file's header
# for why: Office identifies an add-in by this Id, not by domain, so beta
# needs its own to be sideloadable/installable alongside the toolbar
# instance rather than colliding as "the same add-in, different source";
# AZURE_CLIENT_ID can be the same as toolbar's if you want both on one App
# Registration, or different if you registered separate apps per domain —
# see the toolbar compose file's header for the full explanation;
# SESSION_SECRET and POSTGRES_PASSWORD should NOT be reused from the
# toolbar stack's .env either), host port (8081, not 8080 — avoids
# colliding with the toolbar stack on the same host), and image name.
# Own Postgres, own catalog_files bind mount — fully isolated from
# production data, deliberately.
#
# Cloudflare is expected to route https://beta.deckcelerate.com to this
# host's port 8081.
services:
  strategy-toolbar:
    build:
      context: .
      args:
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
    image: deckcelerate-beta:latest
    ports:
      - "8081:8080"
    environment:
      # DOMAIN and MANIFEST_ID come from .env (env_file below), not here.
      - DATABASE_URL=postgres://postgres:${POSTGRES_PASSWORD}@db:5432/strategytoolbar
      - CATALOG_DIR=/app/data/catalog
    env_file:
      - .env
    volumes:
      - ./data/catalog:/app/data/catalog
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=strategytoolbar
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  pgdata:
