<!doctype html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Content Library</title>
  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,400;0,500;0,600;0,700;0,800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/assets/tokens.css?v=__CACHE_BUST__" />
  <link rel="stylesheet" href="/gallery.css?v=__CACHE_BUST__" />
</head>
<body>
  <div id="tabs" class="gallery-tabs"></div>
  <div class="gallery-search-row">
    <input type="search" id="searchInput" placeholder="Search title or tags…" autocomplete="off" />
  </div>
  <div id="status" class="gallery-status"></div>
  <div class="gallery-main">
    <div id="galleryGrid" class="gallery-body"></div>
    <div id="previewPanel" class="preview-panel" style="display: none;">
      <img id="previewImg" alt="" />
      <h3 id="previewTitle"></h3>
      <button id="btnInsert" type="button">Insert</button>
      <button id="btnInsertAsSlide" type="button" style="display: none;" title="Inserts directly as a permanent new slide — no temporary slide, no copy/paste, no Finish step.">Insert as New Slide</button>
      <button id="btnEdit" type="button" style="display: none;">Edit Graphic</button>
      <button id="btnEditDetails" type="button" style="display: none;">Edit Details</button>
      <button id="btnDelete" type="button" style="display: none;">Delete</button>
      <form id="editDetailsForm" style="display: none;">
        <label>Title <input id="editTitle" type="text" /></label>
        <div id="editScopedFields">
          <label>Tags <input id="editTags" type="text" placeholder="comma, separated" /></label>
          <label>Group <select id="editGroup"></select></label>
        </div>
        <div class="edit-actions">
          <button type="submit">Save</button>
          <button type="button" id="btnEditCancel">Cancel</button>
        </div>
        <p id="editError" class="error" style="display: none;"></p>
      </form>
    </div>
  </div>
  <script src="/gallery.js?v=__CACHE_BUST__"></script>
</body>
</html>
