<!doctype html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Content Library</title>
  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,400;0,500;0,600;0,700;0,800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/assets/tokens.css?v=__CACHE_BUST__" />
  <link rel="stylesheet" href="/gallery.css?v=__CACHE_BUST__" />
</head>
<body>
  <div id="tabs" class="gallery-tabs"></div>
  <div class="gallery-search-row">
    <input type="search" id="searchInput" placeholder="Search title or tags…" autocomplete="off" />
  </div>
  <div id="status" class="gallery-status"></div>
  <div class="gallery-main">
    <div id="galleryGrid" class="gallery-body"></div>
    <div id="previewPanel" class="preview-panel" style="display: none;">
      <img id="previewImg" alt="" />
      <h3 id="previewTitle"></h3>

      <div class="preview-actions preview-actions-primary">
        <button id="btnInsert" type="button" class="btn-primary">Insert Graphic</button>
        <button
          id="btnInsertAsSlide"
          type="button"
          class="btn-primary"
          style="display: none;"
          title="Inserts directly as a permanent new slide — no temporary slide, no copy/paste, no Finish step."
        >
          Insert as New Slide
        </button>
      </div>

      <div id="metaSection" class="preview-meta" style="display: none;">
        <div class="meta-row">
          <span class="meta-label">Title</span>
          <span id="metaTitleDisplay" class="meta-value"></span>
          <input id="editTitle" type="text" style="display: none;" />
        </div>
        <div id="metaScopedFields">
          <div class="meta-row">
            <span class="meta-label">Tags</span>
            <span id="metaTagsDisplay" class="meta-value"></span>
            <input id="editTags" type="text" placeholder="comma, separated" style="display: none;" />
          </div>
          <div class="meta-row">
            <span class="meta-label">Group</span>
            <span id="metaGroupDisplay" class="meta-value"></span>
            <select id="editGroup" style="display: none;"></select>
          </div>
          <div id="newGroupRow" class="new-group-row" style="display: none;">
            <input id="newGroupName" type="text" placeholder="New group name" />
            <div class="new-group-actions">
              <button id="btnAddGroupConfirm" type="button">Add Group</button>
              <button id="btnAddGroupCancel" type="button">Cancel</button>
            </div>
          </div>
        </div>
        <button id="btnSaveDetails" type="button" style="display: none;">Update Metadata</button>
        <p id="editError" class="error" style="display: none;"></p>
      </div>

      <div id="manageActionsRow" class="preview-actions preview-actions-manage" style="display: none;">
        <button id="btnEdit" type="button" style="display: none;">Edit Graphic</button>
        <button id="btnDelete" type="button" style="display: none;">Delete Graphic</button>
      </div>

      <p id="previewError" class="error" style="display: none;"></p>
    </div>
  </div>
  <script src="/gallery.js?v=__CACHE_BUST__"></script>
</body>
</html>
